<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="color-scheme" content="light dark">
<title>중국어 회화 말하기</title>
<link rel="manifest" href="manifest.json"><link rel="apple-touch-icon" href="apple-touch-icon.png"><meta name="theme-color" content="#b8452f"><meta name="apple-mobile-web-app-capable" content="yes">
<style>
:root{--bg:light-dark(#f6f5f2,#141416);--card:light-dark(#fff,#1e1f22);--ink:light-dark(#1d1d1f,#ececee);--sub:light-dark(#6b6b70,#9a9aa2);--line:light-dark(#e6e4df,#2c2d31);
--acc:#d6334a;--accs:light-dark(#fde8eb,#3a1c22);--ok:#1f9d61;--oks:light-dark(#e3f6ec,#15301f);--bad:#d9822b;--bads:light-dark(#fdf0e1,#3a2a17);--me:light-dark(#b8452f,#e2725b);--mes:light-dark(#fff1ea,#3a231c)}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Noto Sans KR","Noto Sans JP",sans-serif}
button{font:inherit;color:inherit;border:0;background:none;cursor:pointer}
.app{max-width:560px;margin:0 auto;min-height:100dvh;display:flex;flex-direction:column}
header{position:sticky;top:0;z-index:5;background:var(--bg);display:flex;align-items:center;gap:8px;padding:14px 16px 10px}
header h1{font-size:19px;margin:0;flex:1;letter-spacing:-.3px}
.icon{width:38px;height:38px;border-radius:12px;display:grid;place-items:center;font-size:19px;background:var(--card);border:1px solid var(--line)}
.hidden{display:none!important}
/* home */
.summary{margin:4px 16px 14px;padding:16px;border-radius:18px;background:var(--acc);color:#fff;display:flex;align-items:center;gap:14px}
.summary b{font-size:26px}.summary small{opacity:.9;display:block;font-size:13px;line-height:1.5}
.bar{height:6px;border-radius:3px;background:rgba(255,255,255,.3);margin-top:8px;overflow:hidden}.bar i{display:block;height:100%;background:#fff}
.stage{margin:0 16px 12px;background:var(--card);border:1px solid var(--line);border-radius:18px;overflow:hidden}
.stage>button{width:100%;display:flex;align-items:center;gap:12px;padding:14px;text-align:left}
.num{width:40px;height:40px;border-radius:12px;background:var(--accs);color:var(--acc);font-weight:800;display:grid;place-items:center;flex:none}
.stage.done .num{background:var(--oks);color:var(--ok)}
.stage h3{margin:0;font-size:16px}.stage p{margin:2px 0 0;font-size:13px;color:var(--sub)}
.cnt{font-size:12px;color:var(--sub);flex:none}
.scs{border-top:1px solid var(--line)}
.sc{width:100%;display:flex;align-items:center;gap:10px;padding:12px 14px 12px 66px;text-align:left;border-bottom:1px solid var(--line)}
.sc:last-child{border-bottom:0}.sc span{flex:1;font-size:15px}.sc em{font-style:normal;font-size:12px;color:var(--sub);display:block}
.stars{font-size:14px;letter-spacing:1px;color:#e6a817;flex:none}.stars .o{color:var(--line)}
.tip{margin:6px 16px 28px;font-size:12.5px;color:var(--sub);line-height:1.6}
/* talk */
.sit{margin:0 16px 8px;padding:10px 14px;border-radius:14px;background:var(--card);border:1px solid var(--line);font-size:13.5px;color:var(--sub)}
.sit b{color:var(--ink)}
.prog{height:4px;margin:0 16px 6px;border-radius:2px;background:var(--line);overflow:hidden}.prog i{display:block;height:100%;background:var(--acc);transition:width .3s}
.chat{flex:1;padding:6px 16px 16px;display:flex;flex-direction:column;gap:10px;overflow-y:auto}
.row{display:flex;gap:8px;align-items:flex-end}.row.me{flex-direction:row-reverse}
.av{width:32px;height:32px;border-radius:50%;background:var(--accs);color:var(--acc);display:grid;place-items:center;font-size:12px;font-weight:700;flex:none}
.row.me .av{background:var(--mes);color:var(--me)}
.bub{max-width:80%;padding:10px 13px;border-radius:16px;background:var(--card);border:1px solid var(--line);font-size:15px;line-height:1.45}
.row.them .bub{border-bottom-left-radius:5px}.row.me .bub{border-bottom-right-radius:5px;background:var(--mes);border-color:transparent}
.jp{font-size:18px;font-family:"Noto Sans SC","PingFang SC",sans-serif}.py{font-size:13px;color:var(--sub);margin-top:2px;letter-spacing:.2px}.hg{font-size:13px;color:var(--me);margin-top:2px}.row.them .hg{color:var(--acc)}
.ko{font-size:13px;color:var(--sub);margin-top:3px}
.bub .said{font-size:12.5px;color:var(--sub);margin-top:5px;padding-top:5px;border-top:1px dashed var(--line)}
.badge{display:inline-block;font-size:11px;font-weight:700;padding:1px 7px;border-radius:9px;margin-left:4px;vertical-align:1px}
.badge.ok{background:var(--oks);color:var(--ok)}.badge.bad{background:var(--bads);color:var(--bad)}
.blur .jp,.blur .hg,.blur .py{filter:blur(6px)}
.replay{font-size:12px;color:var(--sub);margin-top:4px}
/* panel */
.panel{position:sticky;bottom:0;background:var(--bg);border-top:1px solid var(--line);padding:12px 16px calc(14px + env(safe-area-inset-bottom))}
.say{font-size:12px;color:var(--sub);margin-bottom:2px}
.target{font-size:17px;font-weight:700;margin-bottom:6px}
.hint{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:8px 12px;margin-bottom:8px}
.hint .jp{font-size:18px}
.res{min-height:20px;font-size:14px;margin:2px 0 8px;text-align:center}
.res.ok{color:var(--ok);font-weight:700}.res.bad{color:var(--bad);font-weight:700}
.ctr{display:flex;align-items:center;justify-content:space-between;gap:10px}
.sm{flex:1;height:46px;border-radius:14px;background:var(--card);border:1px solid var(--line);font-size:13px;font-weight:600}
.mic{width:76px;height:76px;border-radius:50%;background:var(--acc);color:#fff;font-size:32px;flex:none;box-shadow:0 6px 18px rgba(214,51,74,.35)}
.mic.on{animation:pulse 1s infinite}
@keyframes pulse{0%{box-shadow:0 0 0 0 rgba(214,51,74,.55)}100%{box-shadow:0 0 0 18px rgba(214,51,74,0)}}
.after{display:flex;gap:8px;margin-top:8px}.after .sm{height:42px}
.typed{display:flex;gap:6px;margin-top:8px}.typed input{flex:1;height:42px;border-radius:12px;border:1px solid var(--line);background:var(--card);color:var(--ink);padding:0 12px;font-size:16px}
.typed button{padding:0 14px;border-radius:12px;background:var(--me);color:#fff;font-weight:700}
.listen{text-align:center;color:var(--sub);font-size:14px;padding:14px 0}
/* end */
.end{margin:10px 16px;padding:22px 18px;border-radius:20px;background:var(--card);border:1px solid var(--line);text-align:center}
.end .big{font-size:40px;color:#e6a817;letter-spacing:4px}
.end p{color:var(--sub);font-size:14px;margin:8px 0 16px}
.btns{display:flex;gap:8px}.btns button{flex:1;height:48px;border-radius:14px;font-weight:700;background:var(--card);border:1px solid var(--line)}
.btns .pri{background:var(--acc);color:#fff;border-color:var(--acc)}
/* settings */
.sheet{position:fixed;inset:0;background:rgba(0,0,0,.4);z-index:20;display:flex;align-items:flex-end;justify-content:center}
.sheet>div{width:100%;max-width:560px;background:var(--bg);border-radius:22px 22px 0 0;padding:18px 18px calc(22px + env(safe-area-inset-bottom))}
.sheet h2{font-size:17px;margin:0 0 12px}
.opt{margin-bottom:14px}.opt label{display:block;font-size:13px;color:var(--sub);margin-bottom:6px}
.seg{display:flex;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:3px}
.seg button{flex:1;height:36px;border-radius:9px;font-size:13px}.seg button.on{background:var(--acc);color:#fff;font-weight:700}
.note{font-size:12px;color:var(--sub);line-height:1.6;margin-top:6px}
.warn{margin:0 16px 10px;padding:10px 12px;border-radius:12px;background:var(--bads);color:var(--bad);font-size:13px;line-height:1.5}
</style>
</head>
<body>
<div class="app">
  <header>
    <button class="icon hidden" id="back" aria-label="뒤로">←</button>
    <a class="icon hidden" id="toKana" href="../" aria-label="중국어 듣기로" style="text-decoration:none;color:inherit;font-weight:700">听</a>
    <h1 id="title">중국어 회화 말하기</h1>
    <button class="icon" id="setBtn" aria-label="설정">⚙︎</button>
  </header>
  <div id="warn" class="warn hidden"></div>

  <main id="home">
    <div class="summary"><div style="flex:1"><small>완료한 상황</small><b id="done">0</b><b style="font-size:16px"> / <span id="total">0</span></b><div class="bar"><i id="pbar" style="width:0"></i></div></div><div style="font-size:40px">🗣️</div></div>
    <div id="stages"></div>
    <p class="tip">상대가 중국어로 말하면, 아래 한국어 뜻을 보고 🎤 버튼을 눌러 중국어로 대답하세요. 성조까지 맞춰 말할수록 인식이 잘 돼요. 처음엔 <b>따라 말하기</b> 모드(중국어 보임)로, 익숙해지면 ⚙︎ 설정에서 <b>실전</b> 모드(뜻만 보임)로 바꿔 보세요. ⭐3개 = 힌트·건너뛰기 없이 통과.</p>
  </main>

  <section id="talk" class="hidden" style="display:flex;flex-direction:column;flex:1">
    <div class="prog"><i id="tprog"></i></div>
    <div class="sit" id="sit"></div>
    <div class="chat" id="chat"></div>
    <div class="panel" id="panel"></div>
  </section>
</div>

<div class="sheet hidden" id="sheet"><div>
  <h2>설정</h2>
  <div class="opt"><label>연습 모드</label><div class="seg" data-k="mode"><button data-v="follow">따라 말하기</button><button data-v="real">실전 (뜻만)</button></div></div>
  <div class="opt"><label>상대 문장</label><div class="seg" data-k="show"><button data-v="all">중국어+발음+뜻</button><button data-v="jp">중국어만</button><button data-v="hide">숨김(듣기)</button></div></div>
  <div class="opt"><label>말하기 속도</label><div class="seg" data-k="rate"><button data-v="0.7">느리게</button><button data-v="0.85">보통</button><button data-v="1">빠르게</button></div></div>
  <div class="opt"><label>판정 기준</label><div class="seg" data-k="lv"><button data-v="0.5">너그럽게</button><button data-v="0.65">보통</button><button data-v="0.8">엄격</button></div></div>
  <div class="opt"><label>상대가 말한 뒤 마이크 자동 켜기</label><div class="seg" data-k="auto"><button data-v="0">끔</button><button data-v="1">켬</button></div></div>
  <p class="note">음성인식은 휴대폰 크롬(안드로이드)이나 사파리(아이폰)에서 됩니다. 처음 🎤를 누르면 마이크 권한을 허용해 주세요. 인식이 안 될 때는 '직접 입력'이나 '맞게 말했어요'로 넘어갈 수 있어요.</p>
  <div class="btns" style="margin-top:12px"><button class="pri" id="closeSet">닫기</button></div>
</div></div>

    if(r.isFinal){finals=[...r].map(a=>a.transcript)}else onInterim&&onInterim(last)};
  rec.onerror=e=>{rec=null;rej(e.error||'error')};
  rec.onend=()=>{rec=null;if(finals)res(finals);else if(last)res([last]);else rej('no-speech')};
  try{rec.start()}catch(e){rej('start')}})}
function stopListen(){if(rec)try{rec.stop()}catch(e){}}

/* ---------- home ---------- */
const key=(s,c)=>s+'-'+c;
function starHtml(n){return '<span class="stars">'+'★'.repeat(n)+'<span class="o">'+'★'.repeat(3-n)+'</span></span>'}
function renderHome(){
  let tot=0,dn=0;const box=$('#stages');box.innerHTML='';
  D.forEach((st,si)=>{let c=0;st.sc.forEach((_,ci)=>{tot++;if(P[key(si,ci)]){c++;dn++}});
    const el=document.createElement('div');el.className='stage'+(c===st.sc.length?' done':'');
    el.innerHTML=`<button data-s="${si}"><div class="num">${c===st.sc.length?'✓':si+1}</div><div style="flex:1"><h3>${si+1}단계 · ${st.t}</h3><p>${st.d}</p></div><div class="cnt">${c}/${st.sc.length}</div></button>`+
      `<div class="scs ${open===si?'':'hidden'}">`+st.sc.map((sc,ci)=>`<button class="sc" data-s="${si}" data-c="${ci}"><span>${sc.t}<em>${sc.d}</em></span>${starHtml(P[key(si,ci)]||0)}</button>`).join('')+'</div>';
    box.appendChild(el)});
  $('#done').textContent=dn;$('#total').textContent=tot;$('#pbar').style.width=(tot?dn/tot*100:0)+'%'}
$('#stages').addEventListener('click',e=>{const b=e.target.closest('button');if(!b)return;
  if(b.classList.contains('sc')){startTalk(+b.dataset.s,+b.dataset.c);return}
  const si=+b.dataset.s;open=open===si?-1:si;store.set('open',open);renderHome()});

/* ---------- talk ---------- */
let T=null; // {si,ci,i,hint,skip,ok,busy}
function show(view){$('#home').classList.toggle('hidden',view!=='home');$('#talk').classList.toggle('hidden',view!=='talk');
  $('#back').classList.toggle('hidden',view==='home');$('#toKana').classList.toggle('hidden',view!=='home'||!/\/chinese\/talk/.test(location.pathname));$('#title').textContent=view==='home'?'중국어 회화 말하기':`${D[T.si].sc[T.ci].t}`}
function startTalk(si,ci){T={si,ci,i:0,hint:0,skip:0,ok:0,miss:0,gen:(T?T.gen:0)+1};const sc=D[si].sc[ci];
  $('#sit').innerHTML=`<b>상황</b> ${sc.d} · <b>상대</b> ${sc.w}`;$('#chat').innerHTML='';show('talk');window.scrollTo(0,0);step()}
function lines(){return D[T.si].sc[T.ci].L}
function setProg(){$('#tprog').style.width=(T.i/lines().length*100)+'%'}
function scrollDown(){const c=$('#chat');c.scrollTop=c.scrollHeight;window.scrollTo(0,document.body.scrollHeight)}
function themBubble(l){const sc=D[T.si].sc[T.ci];const r=document.createElement('div');r.className='row them';
  const hide=S.show==='hide';
  r.innerHTML=`<div class="av">${sc.w.slice(0,2)}</div><div class="bub ${hide?'blur':''}"><div class="jp">${l[1]}</div>${S.show==='all'?`<div class="py">${l[2]}</div><div class="hg">${l[3]}</div><div class="ko">${l[4]}</div>`:''}<div class="replay">🔊 다시 듣기${hide?' · 눌러서 보기':''}</div></div>`;
  r.querySelector('.bub').onclick=function(){this.classList.remove('blur');if(!this.querySelector('.ko')&&S.show!=='all'){this.insertAdjacentHTML('beforeend',`<div class="py">${l[2]}</div><div class="hg">${l[3]}</div><div class="ko">${l[4]}</div>`)}speak(l[1])};
  $('#chat').appendChild(r);scrollDown()}
function meBubble(l,heard,sc,how){const r=document.createElement('div');r.className='row me';
  const tag=how==='skip'?'<span class="badge bad">건너뜀</span>':how==='self'?'<span class="badge ok">통과</span>':`<span class="badge ok">${Math.round(sc*100)}%</span>`;
  r.innerHTML=`<div class="av">나</div><div class="bub"><div class="jp">${l[1]}${tag}</div><div class="py">${l[2]}</div><div class="hg">${l[3]}</div><div class="ko">${l[4]}</div>${heard?`<div class="said">🎤 내가 한 말: ${esc(heard)}</div>`:''}</div>`;
  r.querySelector('.bub').onclick=()=>speak(l[1]);$('#chat').appendChild(r);scrollDown()}
function esc(s){return s.replace(/[&<>]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;'})[c])}
async function step(){
  const g=T.gen;setProg();const L=lines();
  if(T.i>=L.length){finish();return}
  const l=L[T.i];
  if(l[0]==='A'){$('#panel').innerHTML=`<div class="listen">🔊 ${D[T.si].sc[T.ci].w}의 말을 들어 보세요…</div>`;
    themBubble(l);await speak(l[1]);if(g!==T.gen)return;await new Promise(r=>setTimeout(r,350));if(g!==T.gen)return;T.i++;step();return}
  userTurn(l)}
function userTurn(l){
  T.tries=0;const real=S.mode==='real';T.hinted=!real;
  $('#panel').innerHTML=`<div class="say">이렇게 말해 보세요</div><div class="target">🇰🇷 ${l[4]}</div>
   <div class="hint ${real?'hidden':''}" id="hintBox"><div class="jp">${l[1]}</div><div class="py">${l[2]}</div><div class="hg">${l[3]}</div></div>
   <div class="res" id="res">${SR?'🎤를 누르고 중국어로 말하세요':'이 브라우저는 음성인식이 안 돼요. 소리 내어 말한 뒤 아래에서 선택하세요.'}</div>
   <div class="ctr"><button class="sm" id="hintBtn">${real?'💡 힌트':'🔊 모범 발음'}</button><button class="mic" id="mic" aria-label="말하기">🎤</button><button class="sm" id="skipBtn">⏭ 건너뛰기</button></div>
   <div class="after hidden" id="after"><button class="sm" id="retry">다시 말하기</button><button class="sm" id="selfOk">맞게 말했어요</button></div>
   <div class="typed ${SR?'hidden':''}" id="typed"><input id="tin" placeholder="중국어로 입력 (선택)" lang="zh-CN"><button id="tgo">확인</button></div>`;
  $('#hintBtn').onclick=()=>{const hb=$('#hintBox');if(hb.classList.contains('hidden')){hb.classList.remove('hidden');if(S.mode==='real')T.hint++;T.hinted=true;$('#hintBtn').textContent='🔊 모범 발음'}else speak(l[1])};
  $('#skipBtn').onclick=()=>{stopListen();T.skip++;meBubble(l,'',0,'skip');next()};
  $('#retry').onclick=()=>doMic(l);
  $('#selfOk').onclick=()=>{stopListen();T.ok++;meBubble(l,T.lastHeard||'',0,'self');next()};
  $('#mic').onclick=()=>{if(rec){stopListen();return}doMic(l)};
  $('#tgo').onclick=()=>{const v=$('#tin').value.trim();if(v)judge(l,[v])};
  if(!SR)$('#after').classList.remove('hidden');
  if(SR&&S.auto==='1')setTimeout(()=>{if(T&&lines()[T.i]===l)doMic(l)},250);
  scrollDown()}
async function doMic(l){const res=$('#res'),mic=$('#mic');res.className='res';res.textContent='듣고 있어요… 말해 보세요';mic.classList.add('on');$('#after').classList.add('hidden');
  try{const heard=await listen(t=>{res.textContent='… '+t});mic.classList.remove('on');judge(l,heard)}
  catch(err){mic.classList.remove('on');res.className='res bad';
    res.textContent=err==='not-allowed'||err==='service-not-allowed'?'마이크 권한이 꺼져 있어요. 브라우저 설정에서 마이크를 허용해 주세요.':err==='no-speech'?'소리가 안 들렸어요. 다시 눌러서 말해 보세요.':err==='nosr'?'음성인식을 지원하지 않는 브라우저예요.':err==='network'?'음성인식 서버 연결이 안 돼요. 인터넷을 확인해 주세요.':'인식이 안 됐어요. 다시 해 보세요.';
    $('#after').classList.remove('hidden');$('#typed').classList.remove('hidden')}}
function judge(l,heard){const sc=score(heard,l),res=$('#res');T.tries++;T.lastHeard=heard[0];
  if(sc>=+S.lv){res.className='res ok';res.textContent=`⭕ ${Math.round(sc*100)}% 잘했어요!  「${heard[0]}」`;T.ok++;
    $('#mic').disabled=true;meBubble(l,heard[0],sc,'ok');setTimeout(next,900)}
  else{res.className='res bad';res.textContent=`🔺 ${Math.round(sc*100)}% 「${heard[0]}」 — 한 번 더!`;if(T.tries===1)T.miss++;
    if(S.mode==='real'&&T.tries>=2&&$('#hintBox').classList.contains('hidden')){$('#hintBox').classList.remove('hidden');$('#hintBtn').textContent='🔊 모범 발음'}
    $('#after').classList.remove('hidden');speak(l[1])}}
function next(){T.i++;step()}
function finish(){setProg();const n=lines().filter(l=>l[0]==='U').length;
  let stars=3;const pen=T.skip*2+T.hint+T.miss;if(pen>=1)stars=2;if(pen>=3||T.skip>=2)stars=1;if(T.skip>=n)stars=0;
  const k=key(T.si,T.ci);if(stars>(P[k]||0)){P[k]=stars;store.set('prog',P)}
  const st=D[T.si];let ns=T.si,nc=T.ci+1;if(nc>=st.sc.length){ns++;nc=0}const hasNext=ns<D.length;
  $('#panel').innerHTML=`<div class="btns"><button id="again">다시 하기</button>${hasNext?'<button class="pri" id="nxt">다음 상황 →</button>':'<button class="pri" id="home2">처음으로</button>'}</div>`;
  const e=document.createElement('div');e.className='end';
  e.innerHTML=`<div class="big">${'★'.repeat(stars)}<span style="color:var(--line)">${'★'.repeat(3-stars)}</span></div><h3 style="margin:6px 0 0">대화 완료!</h3><p>내 차례 ${n}번 · 한 번에 통과 ${n-T.miss-T.skip} · 힌트 ${T.hint} · 건너뜀 ${T.skip}</p>`;
  $('#chat').appendChild(e);scrollDown();
  $('#again').onclick=()=>startTalk(T.si,T.ci);
  if(hasNext)$('#nxt').onclick=()=>{open=ns;store.set('open',open);startTalk(ns,nc)};else $('#home2').onclick=goHome}
function goHome(){if(T)T.gen++;stopListen();if('speechSynthesis' in window)speechSynthesis.cancel();renderHome();show('home')}
$('#back').onclick=goHome;

/* ---------- settings ---------- */
function paintSet(){document.querySelectorAll('.seg').forEach(g=>g.querySelectorAll('button').forEach(b=>b.classList.toggle('on',S[g.dataset.k]===b.dataset.v)))}
document.querySelectorAll('.seg').forEach(g=>g.onclick=e=>{const b=e.target.closest('button');if(!b)return;S[g.dataset.k]=b.dataset.v;store.set('set',S);paintSet()});
$('#setBtn').onclick=()=>{paintSet();$('#sheet').classList.remove('hidden')};
$('#closeSet').onclick=()=>$('#sheet').classList.add('hidden');
$('#sheet').onclick=e=>{if(e.target.id==='sheet')$('#sheet').classList.add('hidden')};

if(!SR){const w=$('#warn');w.textContent='이 브라우저에서는 음성인식이 지원되지 않아요. 휴대폰 크롬이나 사파리로 열면 말로 대답할 수 있어요. (지금은 듣기·직접 입력으로 연습 가능)';w.classList.remove('hidden')}
renderHome();show('home');
if('serviceWorker' in navigator)navigator.serviceWorker.register('sw.js');
</script>
</body>
