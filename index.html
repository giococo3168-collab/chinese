<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#ffffff">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="중국어 듣기">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" href="icon-192.png">
<title>중국어 듣기 2000</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@400;700&family=Noto+Sans+KR:wght@400;600;800&display=swap" rel="stylesheet">
<style>
/* VOICE: 귀로 배우는 회화 수첩 — 차분하고 손에 익는 도구
   IDEA: 중국어 단어장 + 카세트 플레이어 — 카드가 줄줄이, 아래에 재생 바
   PICTURE: 지금 재생 중인 카드가 붉은 도장 테두리로 빛나고, 아래 재생 바가 진행을 보여 줌
   COLOUR and TYPE: 흰 종이, 먹색, 인주 빨강(강조), 남색(재생) / Noto Sans SC + Noto Sans KR
   LAYOUT: 상단 분류·검색, 가운데 카드 목록, 하단 재생 바와 탭 */
:root{color-scheme:light dark;
--bg:light-dark(#ffffff,#121316);--paper:light-dark(#ffffff,#1a1c20);--ink:light-dark(#18181b,#ecebe7);
--mute:light-dark(#66666e,#9b9ba3);--red:light-dark(#c41e3a,#ef5a6f);--redbg:light-dark(#fdecee,#3a1a20);
--blue:light-dark(#1f3a5f,#8fb3e8);--bluebg:light-dark(#e9eff8,#1c2840);--line:light-dark(#e7e5e1,#2b2d33);--ok:light-dark(#2e7d4f,#6cc795)}
:root[data-theme=light]{color-scheme:light}:root[data-theme=dark]{color-scheme:dark}
*{box-sizing:border-box;min-width:0}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.55 "Noto Sans KR",system-ui,sans-serif;overflow-x:clip;padding-bottom:calc(150px + env(safe-area-inset-bottom))}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,input:focus-visible,select:focus-visible{outline:3px solid var(--blue);outline-offset:2px}
[hidden]{display:none!important}
.zh{font-family:"Noto Sans SC","Noto Sans KR",sans-serif}
.band{max-width:1100px;margin:0 auto;padding:max(18px,env(safe-area-inset-top)) max(4vw,14px) 10px}
header{display:flex;flex-wrap:wrap;align-items:end;justify-content:space-between;gap:10px 16px;border-bottom:2px solid var(--red);padding-bottom:12px}
h1{margin:0;font-size:clamp(24px,4vw,36px);line-height:1.1;font-weight:800}
h1 span{color:var(--red)}
.sub{font-size:14px;color:var(--mute);margin-top:4px}
.stat{font-size:14px;color:var(--mute);text-align:right}
.stat b{color:var(--ink);font-size:18px}
.q{width:100%;font:inherit;font-size:16px;padding:11px 14px;min-height:46px;border:1.5px solid var(--line);border-radius:12px;background:var(--paper);color:var(--ink);margin:14px 0 10px}
.pills{display:flex;gap:8px;overflow-x:auto;padding:2px 0 10px;scrollbar-width:thin}
.pills button{flex:none;border:1.5px solid var(--line);background:var(--paper);border-radius:999px;padding:8px 14px;min-height:42px;font-weight:600;font-size:15px;white-space:nowrap}
.pills button[aria-pressed=true]{background:var(--ink);border-color:var(--ink);color:var(--bg)}
.pills small{opacity:.6;font-weight:400}
.note{font-size:14px;color:var(--mute);margin:2px 0 10px}
.tools{display:flex;flex-wrap:wrap;gap:8px;margin:0 0 12px}
.chip{border:1.5px solid var(--line);background:var(--paper);border-radius:10px;padding:8px 12px;min-height:42px;font-size:14px;font-weight:600}
.chip[aria-pressed=true]{background:var(--bluebg);border-color:var(--blue);color:var(--blue)}
.list{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:10px}
.list.s{grid-template-columns:repeat(auto-fill,minmax(320px,1fr))}
.card{position:relative;border:1.5px solid var(--line);background:var(--paper);border-radius:14px;padding:12px 52px 12px 14px;cursor:pointer;transition:border-color .2s,box-shadow .2s}
.card:hover{border-color:var(--ink)}
.card.now{border-color:var(--red);box-shadow:0 0 0 2px var(--red) inset}
.card.done{opacity:.55}
.card .t{font-size:26px;line-height:1.25;font-weight:700}
.list.s .card .t{font-size:20px;font-weight:400}
.card .py{color:var(--red);font-size:15px;margin-top:2px}
.card .hg{color:var(--mute);font-size:14px}
.card .ko{font-weight:600;margin-top:4px}
.blind .card:not(.show) .ko{color:transparent;background:var(--line);border-radius:6px;user-select:none}
.card .ic{position:absolute;right:8px;width:38px;height:38px;border-radius:50%;border:1.5px solid var(--line);background:var(--paper);display:grid;place-items:center;color:var(--blue)}
.card .sp{top:8px}.card .mk{top:52px;color:var(--mute);font-size:18px}
.card .mk[aria-pressed=true]{color:var(--ok);border-color:var(--ok)}
.empty{color:var(--mute);padding:20px 0}
.player{position:fixed;left:0;right:0;bottom:calc(64px + env(safe-area-inset-bottom));z-index:9;background:var(--paper);border-top:1.5px solid var(--line);box-shadow:0 -6px 18px light-dark(rgba(0,0,0,.06),rgba(0,0,0,.4))}
.player .in{max-width:1100px;margin:0 auto;padding:8px max(4vw,12px);display:flex;align-items:center;gap:10px}
.pb{border:0;background:var(--blue);color:light-dark(#fff,#121316);width:52px;height:52px;border-radius:50%;display:grid;place-items:center;flex:none}
.pb.sm{width:42px;height:42px;background:var(--bluebg);color:var(--blue)}
.now-t{flex:1;min-width:0}
.now-t .a{font-size:17px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.now-t .b{font-size:13px;color:var(--mute);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.bar{height:4px;background:var(--line)}.bar div{height:100%;background:var(--red);width:0;transition:width .3s}
details.set{margin:0 0 12px;border:1.5px solid var(--line);border-radius:12px;background:var(--paper)}
details.set summary{padding:10px 14px;font-weight:600;cursor:pointer;min-height:44px;display:flex;align-items:center}
.setg{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:10px 16px;padding:0 14px 14px}
.setg label{font-size:14px;color:var(--mute);display:grid;gap:4px}
.setg select{font:inherit;font-size:16px;min-height:42px;border:1.5px solid var(--line);border-radius:10px;background:var(--paper);color:var(--ink);padding:0 8px}
.tab{position:fixed;left:0;right:0;bottom:0;z-index:10;display:grid;grid-template-columns:repeat(3,minmax(0,1fr));background:var(--paper);border-top:2px solid var(--red);padding-bottom:env(safe-area-inset-bottom)}
.tab button{border:0;background:none;min-height:64px;font-size:13px;font-weight:600;color:var(--mute);display:grid;place-items:center;padding:6px 0}
.tab b{font:700 22px/1 "Noto Sans SC",sans-serif}
.tab button[aria-current=true]{color:var(--red)}
.quiz{max-width:640px;margin:16px auto 0}
.qbox{border:1.5px solid var(--line);border-radius:16px;background:var(--paper);padding:18px}
.qtop{display:flex;justify-content:space-between;gap:10px;align-items:center;color:var(--mute);font-size:14px;margin-bottom:14px;flex-wrap:wrap}
.qplay{display:flex;gap:10px;justify-content:center;margin:8px 0 16px}
.qplay .pb{width:72px;height:72px}
.qans{text-align:center;min-height:86px}
.qans .t{font-size:30px;font-weight:700}.qans .py{color:var(--red)}
.opts{display:grid;gap:10px}
.opt{border:1.5px solid var(--line);background:var(--paper);border-radius:12px;padding:12px 14px;min-height:52px;text-align:left;font-size:16px;font-weight:600}
.opt.right{border-color:var(--ok);background:light-dark(#e7f5ec,#163022);color:var(--ok)}
.opt.wrong{border-color:var(--red);background:var(--redbg);color:var(--red)}
.qnext{margin-top:14px;width:100%;border:0;background:var(--ink);color:var(--bg);border-radius:12px;min-height:50px;font-weight:700}
.seg{display:inline-flex;border:1.5px solid var(--line);border-radius:999px;overflow:hidden}
.seg button{border:0;background:none;padding:7px 14px;min-height:40px;font-size:14px;font-weight:600}
.seg button[aria-pressed=true]{background:var(--ink);color:var(--bg)}
@media(max-width:600px){h1{font-size:24px}.sub{display:none}.list,.list.s{grid-template-columns:minmax(0,1fr)}.card .t{font-size:24px}}
@media(prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<div class="band">
<header>
  <div><h1>중국어 <span>듣기</span> 2000</h1><div class="sub">단어 2000 · 회화 2000 — 듣고 따라 말하며 익혀요</div></div>
  <div class="stat" id="stat"></div>
</header>

<section id="vList">
  <input class="q" id="q" type="search" placeholder="검색 (한국어 뜻 · 중국어 · 병음 · 한글 발음)" aria-label="검색">
  <div class="pills" id="pills" role="group" aria-label="분류"></div>
  <div class="note" id="note"></div>
  <details class="set">
    <summary>듣기 설정</summary>
    <div class="setg">
      <label>말하기 속도<select id="sRate"><option value="0.6">아주 천천히 (0.6)</option><option value="0.8">천천히 (0.8)</option><option value="1">보통 (1.0)</option></select></label>
      <label>한 항목 반복<select id="sRep"><option value="1">1번</option><option value="2">2번</option><option value="3">3번</option></select></label>
      <label>항목 사이 간격<select id="sGap"><option value="0.8">짧게</option><option value="1.5">보통</option><option value="3">길게 (따라 말하기)</option></select></label>
      <label>한국어 뜻도 읽기<select id="sKo"><option value="1">중국어 → 한국어 뜻</option><option value="0">중국어만</option></select></label>
    </div>
  </details>
  <div class="tools">
    <button class="chip" id="bBlind" aria-pressed="false">뜻 가리기</button>
    <button class="chip" id="bSkip" aria-pressed="false">외운 것 빼고 듣기</button>
    <button class="chip" id="bShuf" aria-pressed="false">섞어서 듣기</button>
  </div>
  <div class="list" id="list"></div>
</section>

<section id="vQuiz" class="quiz" hidden>
  <div class="qbox">
    <div class="qtop"><div class="seg" role="group" aria-label="퀴즈 범위"><button data-qm="w" aria-pressed="true">단어</button><button data-qm="s" aria-pressed="false">회화</button></div><span id="qscore">0 / 0</span></div>
    <div class="qplay"><button class="pb" id="qPlay" aria-label="다시 듣기"><svg width="30" height="30" viewBox="0 0 24 24"><path d="M4 9v6h4l5 4V5L8 9H4z" fill="currentColor"/><path d="M16 8.5a5 5 0 0 1 0 7M18.5 6a8.5 8.5 0 0 1 0 12" stroke="currentColor" stroke-width="2" fill="none" stroke-linecap="round"/></svg></button><button class="pb sm" id="qSlow" aria-label="천천히 듣기" style="align-self:center">0.6</button></div>
    <div class="qans" id="qans"><div class="note">듣고 알맞은 뜻을 고르세요</div></div>
    <div class="opts" id="opts"></div>
    <button class="qnext" id="qnext" hidden>다음 문제</button>
  </div>
  <p class="note" style="text-align:center;margin-top:12px">틀린 문제는 자동으로 다시 나와요.</p>
</section>
</div>

<div class="player" id="player">
  <div class="bar"><div id="prog"></div></div>
  <div class="in">
    <button class="pb sm" id="pPrev" aria-label="이전"><svg width="20" height="20" viewBox="0 0 24 24"><path d="M6 6h2v12H6zM20 6v12L9 12z" fill="currentColor"/></svg></button>
    <button class="pb" id="pPlay" aria-label="전체 듣기"><svg id="icPlay" width="26" height="26" viewBox="0 0 24 24"><path d="M7 5v14l12-7z" fill="currentColor"/></svg><svg id="icPause" width="26" height="26" viewBox="0 0 24 24" hidden><path d="M6 5h4v14H6zM14 5h4v14h-4z" fill="currentColor"/></svg></button>
    <button class="pb sm" id="pNext" aria-label="다음"><svg width="20" height="20" viewBox="0 0 24 24"><path d="M16 6h2v12h-2zM4 6v12l11-6z" fill="currentColor"/></svg></button>
    <div class="now-t"><div class="a zh" id="nowA">▶를 누르면 이 목록을 순서대로 읽어 줘요</div><div class="b" id="nowB"></div></div>
  </div>
</div>

<nav class="tab" aria-label="메뉴">
  <button data-go="w"><b>词</b>단어 2000</button>
  <button data-go="s"><b>话</b>회화 2000</button>
  <button data-go="quiz"><b>听</b>듣기 퀴즈</button>
</nav>

？","jīpiào dìng hǎolema","찌퍄오 띵 하오러마","비행기표 예약했어요?"],["酒店订好了。","jiǔdiàn dìnghǎo le","찌우띠엔 띵하오 러","호텔은 예약했어요."],["要办签证吗？","yào bàn qiānzhèng ma","야오 빤 치엔쩡 마","비자 받아야 해요?"],["你一个人去吗？","nǐ yígè rénqù ma","니 이꺼 런취 마","혼자 가요?"],["我跟朋友一起去。","wǒ gēn péngyǒu yìqǐ qù","워 껀 펑요우 이치 취","친구랑 같이 가요."],["上海有什么好玩的？","shànghǎi yǒu shénme hǎowán de","상하이 요우 선머 하오완 더","상하이에 놀 만한 곳 있어요?"],["外滩的夜景很有名。","wàitān de yèjǐng hěn yǒumíng","와이탄 더 예찡 헌 요우밍","와이탄 야경이 유명해요."],["你要带什么东西？","nǐ yào dài shénme dōngxī","니 야오 따이 선머 똥시","뭘 챙겨 갈 거예요?"],["别忘了带充电器。","biéwàngle dài chōngdiànqì","삐에왕러 따이 총띠엔치","충전기 챙기는 거 잊지 마세요."],["你帮我做个攻略吧。","nǐ bāng wǒ zuò gè gōnglüè ba","니 빵 워 쭤 꺼 꽁뤼에 바","여행 계획 좀 짜 줘요."],["预算大概多少？","yùsuàn dàgài duōshǎo","위쏸 따까이 뚸사오","예산은 대략 얼마예요?"],["我想去吃当地的美食。","wǒ xiǎng qù chī dāngdì de měishí","워 샹 취 츠 땅띠 더 메이스","현지 맛집에 가고 싶어요."],["你要去哪些地方？","nǐ yào qù nǎxiēdìfāng","니 야오 취 나시에띠팡","어디어디 갈 거예요?"],["我们第一天去长城。","wǒmen dìyītiān qù chángchéng","워먼 띠이티엔 취 창청","첫째 날은 만리장성에 가요."],["你回来的时候给我带礼物。","nǐ huílái de shíhòu gěi wǒ dài lǐwù","니 후이라이 더 스호우 께이 워 따이 리우","돌아올 때 선물 사 와요."],["旅途愉快！","lǚtúyúkuài","뤼투위콰이","즐거운 여행 되세요!"]]],["초대·방문",[["今天晚上来我家吃饭吧。","jīntiān wǎnshàng lái wǒjiā chīfàn ba","찐티엔 완상 라이 워쨔 츠판 바","오늘 저녁 우리 집에 와서 밥 먹어요."],["好啊，几点去？","hǎo a jǐdiǎn qù","하오 아 찌띠엔 취","좋아요, 몇 시에 가요?"],["需要带什么吗？","xūyào dài shénme ma","쉬야오 따이 선머 마","뭐 가져갈 거 있어요?"],["人来就好。","rénlái jiù hǎo","런라이 찌우 하오","몸만 오면 돼요."],["欢迎欢迎，快请进。","huānyíng huānyíng kuài qǐng jìn","환잉 환잉 콰이 칭 찐","어서 와요, 들어와요."],["不用换鞋。","búyòng huànxié","뿌용 환시에","신발 안 갈아 신어도 돼요."],["请随便坐。","qǐng suíbiàn zuò","칭 쑤이삐엔 쭤","편하게 앉아요."],["喝点儿什么？","hē diǎn'ér shénme","허 띠엔얼 선머","뭐 마실래요?"],["来杯茶吧。","láibēi chá ba","라이뻬이 차 바","차 한 잔 주세요."],["别客气，就像在自己家一样。","bié kèqì jiù xiàng zài zìjǐ jiā yíyàng","삐에 커치 찌우 샹 짜이 쯔찌 쨔 이양","사양 말고 집처럼 편하게 있어요."],["菜做好了，开饭吧。","cài zuòhǎo le kāifàn ba","차이 쭤하오 러 카이판 바","음식 다 됐어요, 밥 먹어요."],["多吃点儿。","duō chī diǎn'ér","뚸 츠 띠엔얼","많이 먹어요."],["你做的菜太好吃了。","nǐ zuò de cài tài hǎochī le","니 쭤 더 차이 타이 하오츠 러","당신이 만든 음식 정말 맛있어요."],["今天麻烦你了。","jīntiān máfán nǐ le","찐티엔 마판 니 러","오늘 번거롭게 했네요."],["时间不早了，我该回去了。","shíjiān bùzǎole wǒgāi huíqù le","스찌엔 뿌짜오러 워까이 후이취 러","시간이 늦었네요, 이제 가 봐야겠어요."],["再坐一会儿吧。","zài zuò yíhuì'er ba","짜이 쭤 이후이얼 바","좀 더 있다 가요."],["下次来我家玩。","xiàcì lái wǒjiā wán","샤츠 라이 워쨔 완","다음엔 우리 집에 놀러 와요."],["我送送你。","wǒ sòng sòng nǐ","워 쏭 쏭 니","배웅해 줄게요."],["路上注意安全。","lùshàng zhùyì'ānquán","루상 쭈이안취엔","가는 길 조심해요."],["谢谢你的热情招待。","xièxiè nǐ de rèqíng zhāodài","시에시에 니 더 러칭 짜오따이","따뜻하게 대접해 줘서 고마워요."]]],["집안일",[["今天轮到你打扫卫生。","jīntiān lúndào nǐ dǎsǎowèishēng","찐티엔 룬따오 니 따싸오웨이성","오늘은 네가 청소할 차례야."],["帮我倒一下垃圾。","bāng wǒ dào yíxià lājī","빵 워 따오 이샤 라찌","쓰레기 좀 버려 줘."],["衣服晾干了吗？","yīfú liànggān le ma","이푸 량깐 러 마","빨래 다 말랐어요?"],["把衣服收进来吧。","bǎ yīfú shōujìnlái ba","빠 이푸 소우찐라이 바","빨래 걷어 와요."],["冰箱里没有东西了。","bīngxiāng lǐ méiyǒu dōngxī le","삥샹 리 메이요우 똥시 러","냉장고에 먹을 게 없어요."],["我们去买点儿菜吧。","wǒmen qù mǎidiǎn'ér cài ba","워먼 취 마이띠엔얼 차이 바","장 좀 보러 가요."],["我来做饭，你洗碗。","wǒlái zuòfàn nǐ xǐwǎn","워라이 쭤판 니 시완","밥은 제가 할 테니 설거지는 당신이 해요."],["地板很干净。","dìbǎn hěn gānjìng","띠빤 헌 깐찡","바닥이 깨끗해요."],["灯坏了，要换一下。","dēnghuài le yàohuàn yíxià","떵화이 러 야오환 이샤","전등이 고장 나서 바꿔야 해요."],["空调太冷了，关小一点儿。","kōngtiáo tàilěng le guānxiǎo yìdiǎn'ér","콩탸오 타이렁 러 꽌샤오 이띠엔얼","에어컨이 너무 추워요, 좀 약하게 해요."],["窗户开一下，通通风。","chuānghù kāi yíxià tōngtōngfēng","촹후 카이 이샤 통통펑","창문 좀 열어서 환기해요."],["别忘了关灯。","biéwàngle guāndēng","삐에왕러 꽌떵","불 끄는 거 잊지 마요."],["水开了。","shuǐkāi le","수이카이 러","물이 끓었어요."]]],["반려동물",[["你养宠物吗？","nǐyǎng chǒngwù ma","니양 총우 마","반려동물 키워요?"],["我养了一只猫。","wǒyǎng le yìzhī māo","워양 러 이쯔 마오","고양이 한 마리 키워요."],["你的狗叫什么名字？","nǐ de gǒujiào shénme míngzì","니 더 꼬우쨔오 선머 밍쯔","강아지 이름이 뭐예요?"],["它几岁了？","tā jǐsuì le","타 찌쑤이 러","몇 살이에요?"],["它真可爱！","tā zhēn kě'ài","타 쩐 커아이","정말 귀여워요!"],["我可以摸摸它吗？","wǒ kěyǐ mōmō tā ma","워 커이 모모 타 마","만져 봐도 돼요?"],["它不咬人。","tā bù yǎo rén","타 뿌 야오 런","사람 안 물어요."],["我每天带狗去散步。","wǒ měitiān dàigǒu qù sànbù","워 메이티엔 따이꼬우 취 싼뿌","매일 강아지 데리고 산책해요."],["它很听话。","tā hěn tīnghuà","타 헌 팅화","말을 잘 들어요."],["猫在睡觉。","māo zài shuìjiào","마오 짜이 수이쨔오","고양이가 자고 있어요."]]],["영화·드라마 하오 시우시","수고했어요, 푹 쉬어요."],["希望一切顺利。","xīwàng yíqièshùnlì","시왕 이치에순리","모든 게 잘되길 바라요."]]],["비교 표현",[["我比他大两岁。","wǒ bǐ tā dà liǎngsuì","워 삐 타 따 량쑤이","저는 그보다 두 살 많아요."],["今天比昨天冷。","jīntiān bǐ zuótiān lěng","찐티엔 삐 쭤티엔 렁","오늘은 어제보다 추워요."],["这家比那家好吃。","zhèjiā bǐ nàjiā hǎochī","쩌쨔 삐 나쨔 하오츠","이 집이 저 집보다 맛있어요."],["坐地铁比坐出租车快。","zuòdìtiě bǐ zuò chūzūchē kuài","쭤띠티에 삐 쭤 추쭈처 콰이","지하철 타는 게 택시보다 빨라요."],["他跟我一样高。","tā gēn wǒ yíyàng gāo","타 껀 워 이양 까오","그는 저랑 키가 같아요."],["这两个颜色差不多。","zhè liǎnggè yánsè chàbuduō","쩌 량꺼 옌써 차부뚸","이 두 색은 거의 비슷해요."],["中文没有英语难。","zhōngwén méiyǒu yīngyǔ nán","쫑원 메이요우 잉위 난","중국어는 영어만큼 어렵지 않아요."],["这个最好。","zhège zuìhǎo","쩌거 쭈이하오","이게 제일 좋아요."],["越便宜越好。","yuè piányi yuè hǎo","위에 피엔이 위에 하오","쌀수록 좋아요."],["越来越好看了。","yuèláiyuè hǎokàn le","위에라이위에 하오칸 러","점점 예뻐지네요."],["我更喜欢这个。","wǒ gèng xǐhuān zhège","워 껑 시환 쩌거","저는 이게 더 좋아요."],["不如去那家店看看。","bùrú qù nàjiādiàn kànkàn","뿌루 취 나쨔띠엔 칸칸","저 가게에 가 보는 게 낫겠어요."],["跟以前不一样了。","gēn yǐqián bù yíyàng le","껀 이치엔 뿌 이양 러","예전이랑 달라졌어요."],["这里的东西比中国便宜。","zhèlǐ de dōngxī bǐ zhōngguó piányi","쩌리 더 똥시 삐 쫑꿔 피엔이","여기 물건이 중국보다 싸요."],["他说中文说得比我好。","tā shuō zhōngwén shuō dé bǐ wǒ hǎo","타 숴 쫑원 숴 떠 삐 워 하오","그는 중국어를 저보다 잘해요."]]],["경험 표현",[["你去过济州岛吗？","nǐ qùguò jìzhōudǎo ma","니 취꿔 찌쪼우따오 마","제주도 가 봤어요?"],["我去过两次。","wǒ qùguò liǎngcì","워 취꿔 량츠","두 번 가 봤어요."],["我还没去过。","wǒ hái méi qùguò","워 하이 메이 취꿔","아직 안 가 봤어요."],["你吃过北京烤鸭吗？","nǐ chī guò běijīngkǎoyā ma","니 츠 꿔 뻬이찡카오야 마","베이징 오리구이 먹어 봤어요?"],["我从来没吃过。","wǒ cónglái méichīguò","워 총라이 메이츠꿔","한 번도 안 먹어 봤어요."],["你用过这个面膜吗？","nǐ yòng guò zhège miànmó ma","니 용 꿔 쩌거 미엔모 마","이 마스크팩 써 봤어요?"],["用过，效果不错。","yòngguò xiàoguǒ búcuò","용꿔 샤오꿔 뿌춰","써 봤는데 괜찮았어요."],["我以前学过一点儿中文。","wǒ yǐqián xuéguò yìdiǎn'ér zhōngwén","워 이치엔 쉬에꿔 이띠엔얼 쫑원","예전에 중국어를 조금 배웠어요."],["我在中国住过一年。","wǒ zài zhōngguó zhù guò yìnián","워 짜이 쫑꿔 쭈 꿔 이니엔","중국에서 1년 살았어요."],["我没听说过。","wǒ méitīngshuōguò","워 메이팅숴꿔","들어 본 적 없어요."],["我见过他一次。","wǒjiàn guò tā yícì","워찌엔 꿔 타 이츠","그를 한 번 본 적 있어요."],["这是我第一次坐高铁。","zhè shì wǒ dìyīcì zuò gāotiě","쩌 스 워 띠이츠 쭤 까오티에","고속철도는 처음 타 봐요."],["我从来没有这么开心过。","wǒ cónglái méiyǒu zhème kāixīn guò","워 총라이 메이요우 쩌머 카이신 꿔","이렇게 즐거운 적은 처음이에요."],["你看过这本书吗？","nǐ kànguò zhè běnshū ma","니 칸꿔 쩌 뻔수 마","이 책 읽어 봤어요?"],["我们以前见过吗？","wǒmen yǐqián jiàn guò ma","워먼 이치엔 찌엔 꿔 마","우리 예전에 본 적 있나요?"]]],["미래 계획",[["明年我想去中国开店。","míngnián wǒ xiǎng qù zhōngguó kāidiàn","밍니엔 워 샹 취 쫑꿔 카이띠엔","내년에 중국에 가게를 열고 싶어요."],["我打算学好中文。","wǒ dǎsuàn xuéhǎo zhōngwén","워 따쏸 쉬에하오 쫑원","중국어를 잘 배울 계획이에요."],["下个月我要去上海出差。","xiàgèyuè wǒyào qù shànghǎi chūchāi","샤꺼위에 워야오 취 상하이 추차이","다음 달에 상하이로 출장 가요."],["以后我想多去旅行。","yǐhòu wǒ xiǎng duō qù lǚxíng","이호우 워 샹 뚸 취 뤼싱","앞으로 여행을 많이 가고 싶어요."],["我准备换一个大一点儿的店。","wǒ zhǔnbèi huàn yígè dà yìdiǎn'ér de diàn","워 쭌뻬이 환 이꺼 따 이띠엔얼 더 띠엔","좀 더 큰 가게로 옮길 준비 중이에요."],["我们打算在中国找合作伙伴。","wǒmen dǎsuàn zài zhōngguó zhǎo hézuòhuǒbàn","워먼 따쏸 짜이 쫑꿔 짜오 허쭤훠빤","중국에서 협력 파트너를 찾을 계획이에요."],["我会努力的。","wǒhuì nǔlì de","워후이 누리 더","열심히 할게요."],["我一定会再来的。","wǒ yídìng huì zài lái de","워 이띵 후이 짜이 라이 더","꼭 다시 올게요."],["明天我会给你打电话。","míngtiān wǒhuì gěi nǐ dǎdiànhuà","밍티엔 워후이 께이 니 따띠엔화","내일 전화할게요."],["希望明年生意更好。","xīwàng míngnián shēngyì gènghǎo","시왕 밍니엔 성이 껑하오","내년엔 장사가 더 잘되길 바라요."]]],["손님 맞이",[["您好，欢迎光临！","nínhǎo huānyíngguānglín","닌하오 환잉꽝린","안녕하세요, 어서 오세요!"],["请进，里面看看。","qǐng jìn lǐmiàn kànkàn","칭 찐 리미엔 칸칸","들어오세요, 안에서 보세요."],["您是第一次来我们店吗？","nín shì dìyīcì lái wǒmen diàn ma","닌 스 띠이츠 라이 워먼 띠엔 마","저희 가게 처음 오셨어요?"],["您是从中国来的吗？","nín shìcóng zhōngguó lái de ma","닌 스총 쫑꿔 라이 더 마","중국에서 오셨어요?"],["您从哪个城市来？","nín cóng nǎge chéngshì lái","닌 총 나거 청스 라이","어느 도시에서 오셨어요?"],["来首尔几天了？","lái shǒu'ěr jǐtiān le","라이 소우얼 찌티엔 러","서울 오신 지 며칠 됐어요?"],["今天天气很冷，进来暖和一下。","jīntiāntiānqì hěn lěng jìnlái nuǎnhuo yíxià","찐티엔티엔치 헌 렁 찐라이 놘훠 이샤","오늘 춥죠, 들어와서 몸 좀 녹이세요."],["您需要帮忙随时叫我。","nín xūyào bāngmáng suíshí jiào wǒ","닌 쉬야오 빵망 쑤이스 쨔오 워","도움이 필요하시면 언제든 불러 주세요."],["这边是护肤品，那边是彩妆。","zhèbiān shì hùfūpǐn nàbiān shì cǎizhuāng","쩌삐엔 스 후푸핀 나삐엔 스 차이쫭","이쪽은 스킨케어, 저쪽은 색조예요."],["新品在这边。","xīnpǐn zài zhèbiān","신핀 짜이 쩌삐엔","신상품은 이쪽에 있어요."],["这些都是今天的特价商品。","zhèxiē dōu shì jīntiān de tèjià shāngpǐn","쩌시에 또우 스 찐티엔 더 터쨔 상핀","이건 다 오늘의 특가 상품이에요."],["您可以慢慢挑。","nín kěyǐ mànmàn tiāo","닌 커이 만만 탸오","천천히 고르세요."],["有喜欢的吗？","yǒu xǐhuān de ma","요우 시환 더 마","마음에 드는 거 있으세요?"],["这款很多人回购。","zhè kuǎn hěnduō rén huígòu","쩌 콴 헌뚸 런 후이꼬우","이 제품은 재구매하는 분이 많아요."],["您的眼光真好。","nín de yǎnguāng zhēn hǎo","닌 더 옌꽝 쩐 하오","안목이 정말 좋으시네요."],["这是我们店的会员卡。","zhèshì wǒmen diàn de huìyuánkǎ","쩌스 워먼 띠엔 더 후이위엔카","이건 저희 가게 회원 카드예요."],["下次来可以打折。","xiàcì lái kěyǐ dǎzhé","샤츠 라이 커이 따쩌","다음에 오시면 할인돼요."],["请拿好您的东西。","qǐng ná hǎo nín de dōngxī","칭 나 하오 닌 더 똥시","물건 잘 챙기세요."],["外面很冷，路上小心。","wàimiàn hěn lěng lùshàng xiǎoxīn","와이미엔 헌 렁 루상 샤오신","밖이 추우니 조심히 가세요."],["期待您的再次光临。","qīdài nín de zàicì guānglín","치따이 닌 더 짜이츠 꽝린","다시 방문해 주시길 기다릴게요."]]],["손님과 잡담",[["你们是来旅游的吗？","nǐmen shì lái lǚyóu de ma","니먼 스 라이 뤼요우 더 마","여행 오셨어요?"],["你们去过哪些地方了？","nǐmen qùguò nǎxiēdìfāng le","니먼 취꿔 나시에띠팡 러","어디어디 가 보셨어요?"],["韩国菜吃得惯吗？","hánguócài chī dé guàn ma","한꿔차이 츠 떠 꽌 마","한국 음식 입에 맞으세요?"],["韩国冷不冷？","hánguó lěngbùlěng","한꿔 렁뿌렁","한국 춥지 않아요?"],["你们住在哪儿？","nǐmen zhù zài nǎ'ér","니먼 쭈 짜이 나얼","어디서 묵으세요?"],["明天打算去哪儿？","míngtiān dǎsuàn qù nǎ'ér","밍티엔 따쏸 취 나얼","내일은 어디 가실 계획이에요?"],["你们一定要去南山塔看看。","nǐmen yídìng yào qù nánshāntǎ kànkàn","니먼 이띵 야오 취 난산타 칸칸","남산타워는 꼭 가 보세요."],["晚上可以去广藏市场吃东西。","wǎnshàng kěyǐ qù guǎngcángshìchǎng chī dōngxī","완상 커이 취 꽝창스창 츠 똥시","저녁엔 광장시장에 가서 먹어 보세요."],["你们的中文说得真好听。","nǐmen de zhōngwén shuō dé zhēn hǎotīng","니먼 더 쫑원 숴 떠 쩐 하오팅","중국어가 정말 듣기 좋아요."],["我也在学中文。","wǒ yě zài xué zhōngwén","워 예 짜이 쉬에 쫑원","저도 중국어 배우고 있어요."],["我的中文还不太好，请见谅。","wǒ de zhōngwén hái bútàihǎo qǐng jiànliàng","워 더 쫑원 하이 뿌타이하오 칭 찌엔량","제 중국어가 아직 서툴러요, 양해해 주세요."],["你们几号回国？","nǐmen jǐhào huíguó","니먼 찌하오 후이꿔","며칠에 귀국하세요?"],["回国前再来一趟吧。","huíguó qián zài lái yítàng ba","후이꿔 치엔 짜이 라이 이탕 바","귀국하기 전에 한 번 더 오세요."],["祝你们在韩国玩得开心。","zhùnǐmen zài hánguó wándé kāixīn","쭈니먼 짜이 한꿔 완떠 카이신","한국에서 즐겁게 보내세요."],["我去过上海，很漂亮。","wǒ qùguò shànghǎi hěnpiàoliàng","워 취꿔 상하이 헌퍄오량","상하이 가 봤는데 정말 예뻤어요."],["中国哪里最好玩？","zhōngguó nǎlǐ zuì hǎowán","쫑꿔 나리 쭈이 하오완","중국은 어디가 제일 재미있어요?"],["欢迎你们下次再来韩国。","huānyíng nǐmen xiàcì zài lái hánguó","환잉 니먼 샤츠 짜이 라이 한꿔","다음에 또 한국에 오세요."]]],["자주 쓰는 문장 패턴",[["我想去洗手间。","wǒ xiǎng qù xǐshǒujiān","워 샹 취 시소우찌엔","화장실에 가고 싶어요."],["我想买这个。","wǒ xiǎng mǎi zhège","워 샹 마이 쩌거","이거 사고 싶어요."],["我要一个。","wǒyào yígè","워야오 이꺼","하나 주세요."],["我要这个，不要那个。","wǒyào zhège búyào nàge","워야오 쩌거 뿌야오 나거","이거 주세요, 저건 됐어요."],["可以给我看看吗？","kěyǐ gěi wǒ kànkàn ma","커이 께이 워 칸칸 마","좀 보여 주실래요?"],["有没有别的？","yǒuméiyǒu biéde","요우메이요우 삐에더","다른 거 있어요?"],["能不能便宜点儿？","néng bùnéng piányi diǎn'ér","넝 뿌넝 피엔이 띠엔얼","좀 싸게 안 될까요?"],["请给我一张收据。","qǐng gěi wǒ yìzhāng shōujù","칭 께이 워 이짱 소우쮜","영수증 한 장 주세요."],["我还要一个。","wǒ háiyào yígè","워 하이야오 이꺼","하나 더 주세요."],["这个怎么卖？","zhège zěnme mài","쩌거 쩐머 마이","이거 어떻게 팔아요?"],["这个是什么做的？","zhège shì shénme zuò de","쩌거 스 선머 쭤 더","이건 뭐로 만들었어요?"],["这个用中文怎么说？","zhège yòng zhōngwén zěnme shuō","쩌거 용 쫑원 쩐머 숴","이건 중국어로 뭐라고 해요?"],["我正在找这个。","wǒ zhèngzài zhǎo zhège","워 쩡짜이 짜오 쩌거","저 이거 찾고 있었어요."],["我不太会说中文。","wǒ bútàihuì shuō zhōngwén","워 뿌타이후이 숴 쫑원","중국어를 잘 못해요."],["请用简单的中文说。","qǐng yòng jiǎndān de zhōngwén shuō","칭 용 찌엔딴 더 쫑원 숴","쉬운 중국어로 말해 주세요."],["你可以用手机翻译一下吗？","nǐ kěyǐ yòng shǒujī fānyì yíxià ma","니 커이 용 소우찌 판이 이샤 마","휴대폰으로 번역해 주실 수 있어요?"],["我们去哪儿吃饭？","wǒmen qù nǎ'ér chīfàn","워먼 취 나얼 츠판","우리 어디서 밥 먹어요?"],["现在去还来得及吗？","xiànzài qù hái láidejí ma","시엔짜이 취 하이 라이더찌 마","지금 가도 늦지 않을까요?"],["我觉得这个更好看。","wǒ juéde zhège gènghǎo kàn","워 쮜에더 쩌거 껑하오 칸","이게 더 예쁜 것 같아요."],["我有一个好消息告诉你。","wǒ yǒu yígè hǎoxiāoxī gàosù nǐ","워 요우 이꺼 하오샤오시 까오쑤 니","좋은 소식이 있어요."]]],["묘사·감각",[["这个很软。","zhège hěnruǎn","쩌거 헌롼","이건 부드러워요."],["这个太硬了。","zhège tàiyìng le","쩌거 타이잉 러","이건 너무 딱딱해요."],["闻起来很香。","wén qǐlái hěnxiāng","원 치라이 헌샹","냄새가 좋아요."],["看起来很好吃。","kànqǐlái hěn hǎochī","칸치라이 헌 하오츠","맛있어 보여요."],["听起来不错。","tīng qǐlái búcuò","팅 치라이 뿌춰","괜찮게 들리네요."],["摸起来很舒服。","mō qǐlái hěn shūfú","모 치라이 헌 수푸","만져 보니 촉감이 좋아요."],["颜色太深了。","yánsè tàishēn le","옌써 타이선 러","색이 너무 진해요."],["颜色太浅了。","yánsè tàiqiǎn le","옌써 타이치엔 러","색이 너무 옅어요."],["这个太大了，拿不动。","zhège tàidà le ná búdòng","쩌거 타이따 러 나 뿌똥","이건 너무 커서 못 들겠어요."],["这个很轻，方便带。","zhège hěn qīng fāngbiàn dài","쩌거 헌 칭 팡삐엔 따이","이건 가벼워서 들고 다니기 편해요."],["房间很大很亮。","fángjiān hěndà hěn liàng","팡찌엔 헌따 헌 량","방이 넓고 밝아요."],["这条街很热闹。","zhètiáo jiē hěn rènào","쩌탸오 찌에 헌 러나오","이 거리는 북적여요."],["这里很安静。","zhèlǐ hěn ānjìng","쩌리 헌 안찡","여기는 조용해요."],["水太烫了。","shuǐtàitàng le","수이타이탕 러","물이 너무 뜨거워요."],["汤有点儿凉了。","tāng yǒudiǎn'ér liáng le","탕 요우띠엔얼 량 러","국이 좀 식었어요."],["这个包装很精致。","zhège bāozhuāng hěn jīngzhì","쩌거 빠오쫭 헌 찡쯔","이 포장은 정말 정교하네요."],["设计很简单。","shèjì hěn jiǎndān","서찌 헌 찌엔딴","디자인이 심플해요."],["看上去很高级。","kànshàngqù hěn gāojí","칸상취 헌 까오찌","고급스러워 보여요."],["这个味道很特别。","zhège wèidào hěn tèbié","쩌거 웨이따오 헌 터삐에","이 맛은 독특해요."],["声音很好听。","shēngyīn hěn hǎotīng","성인 헌 하오팅","목소리가 듣기 좋아요."]]],["쇼핑 후기",[["这个面膜我用了，很好用。","zhège miànmó wǒyòng le hěn hǎo yòng","쩌거 미엔모 워용 러 헌 하오 용","이 마스크팩 써 봤는데 정말 좋아요."],["用完皮肤很水润。","yòng wán pífū hěnshuǐrùn","용 완 피푸 헌수이룬","쓰고 나니 피부가 촉촉해요."],["味道很淡，我很喜欢。","wèidào hěndàn wǒ hěn xǐhuān","웨이따오 헌딴 워 헌 시환","향이 은은해서 좋아요."],["质量比我想的好。","zhìliàng bǐ wǒ xiǎng de hǎo","쯔량 삐 워 샹 더 하오","품질이 생각보다 좋아요."],["价格有点儿贵，但是值得。","jiàgé yǒudiǎn'ér guì dànshì zhíde","쨔꺼 요우띠엔얼 꾸이 딴스 쯔더","가격은 좀 비싸지만 그만한 가치가 있어요."],["包装很漂亮，适合送人。","bāozhuāng hěnpiàoliàng shìhé sòngrén","빠오쫭 헌퍄오량 스허 쏭런","포장이 예뻐서 선물하기 좋아요."],["我已经回购三次了。","wǒ yǐjīng huígòu sāncì le","워 이찡 후이꼬우 싼츠 러","벌써 세 번 재구매했어요."],["朋友都说好用。","péngyǒu dōu shuōhǎo yòng","펑요우 또우 숴하오 용","친구들도 다 좋대요."],["这次买到了很多好东西。","zhècì mǎidào le hěnduō hǎo dōngxī","쩌츠 마이따오 러 헌뚸 하오 똥시","이번에 좋은 물건을 많이 샀어요."],["店员很热情。","diànyuán hěn rèqíng","띠엔위엔 헌 러칭","점원이 정말 친절해요."],["店员会说中文，很方便。","diànyuán huì shuō zhōngwén hěn fāngbiàn","띠엔위엔 후이 숴 쫑원 헌 팡삐엔","점원이 중국어를 해서 편했어요."],["可以退税，太好了。","kěyǐ tuìshuì tàihǎole","커이 투이수이 타이하오러","세금 환급이 돼서 좋았어요."],["下次还来这家店。","xiàcì háilái zhèjiā diàn","샤츠 하이라이 쩌쨔 띠엔","다음에도 이 가게에 올 거예요."],["强烈推荐！","qiángliètuījiàn","챵리에투이찌엔","강력 추천해요!"],["有点儿失望。","yǒudiǎn'ér shīwàng","요우띠엔얼 스왕","조금 실망했어요."],["跟图片不一样。","gēn túpiàn bù yíyàng","껀 투피엔 뿌 이양","사진이랑 달라요."],["尺码有点儿小。","chǐmǎ yǒudiǎn'ér xiǎo","츠마 요우띠엔얼 샤오","사이즈가 좀 작아요."],["物流很快。","wùliú hěnkuài","우리우 헌콰이","배송이 빨라요."],["东西很新鲜。","dōngxī hěn xīnxiān","똥시 헌 신시엔","물건이 신선해요."],["性价比很高，推荐购买。","xìngjiàbǐ hěn gāo tuījiàn gòumǎi","싱쨔삐 헌 까오 투이찌엔 꼬우마이","가성비가 좋아서 구매 추천해요."]]],["시간 표현",[["我每天早上八点出门。","wǒ měitiān zǎoshàng bādiǎn chūmén","워 메이티엔 짜오상 빠띠엔 추먼","매일 아침 8시에 나가요."],["我已经等了一个小时了。","wǒ yǐjīng děng le yígè xiǎoshí le","워 이찡 떵 러 이꺼 샤오스 러","벌써 한 시간 기다렸어요."],["三天以后见。","sāntiān yǐhòu jiàn","싼티엔 이호우 찌엔","3일 후에 봐요."],["一个星期以前我去了上海。","yígè xīngqī yǐqián wǒ qù le shànghǎi","이꺼 싱치 이치엔 워 취 러 상하이","일주일 전에 상하이에 갔어요."],["我们认识很久了。","wǒmen rènshí hěnjiǔ le","워먼 런스 헌찌우 러","우리는 알고 지낸 지 오래됐어요."],["我学中文学了半年。","wǒxué zhōng wénxué le bànnián","워쉬에 쫑 원쉬에 러 빤니엔","중국어를 반년 배웠어요."],["下班以后我们去吃饭吧。","xiàbān yǐhòu wǒmen qù chīfàn ba","샤빤 이호우 워먼 취 츠판 바","퇴근하고 밥 먹으러 가요."],["吃饭的时候不要看手机。","chīfàn de shíhòu búyào kàn shǒujī","츠판 더 스호우 뿌야오 칸 소우찌","밥 먹을 때는 휴대폰 보지 마요."],["我到了就给你打电话。","wǒ dào le jiù gěi nǐ dǎdiànhuà","워 따오 러 찌우 께이 니 따띠엔화","도착하면 바로 전화할게요."],["等一会儿再说。","děng yíhuì'er zàishuō","떵 이후이얼 짜이숴","이따가 다시 얘기해요."],["我刚刚到。","wǒ gānggāng dào","워 깡깡 따오","방금 도착했어요."],["他刚走。","tā gāng zǒu","타 깡 쪼우","그는 방금 갔어요."],["电影快开始了。","diànyǐng kuài kāishǐ le","띠엔잉 콰이 카이스 러","영화가 곧 시작해요."],["我们还有十分钟。","wǒmen háiyǒu shífēnzhōng","워먼 하이요우 스펀쫑","아직 10분 남았어요."],["时间到了。","shíjiān dào le","스찌엔 따오 러","시간 다 됐어요."],["今天是几月几号？","jīntiān shì jǐyuè jǐhào","찐티엔 스 찌위에 찌하오","오늘이 몇 월 며칠이에요?"],["下个星期三是我的生日。","xiàgèxīngqī sānshì wǒ de shēngrì","샤꺼싱치 싼스 워 더 성르","다음 주 수요일이 제 생일이에요."],["我们周末见吧。","wǒmen zhōumò jiàn ba","워먼 쪼우모 찌엔 바","주말에 봐요."],["从早上忙到晚上。","cóng zǎoshàng máng dào wǎnshàng","총 짜오상 망 따오 완상","아침부터 저녁까지 바빠요."],["每个月一号发工资。","měigè yuè yīhào fāgōngzī","메이꺼 위에 이하오 파꽁쯔","매달 1일에 월급이 나와요."]]],["이유·설명",[["因为下雨，所以我没去。","yīnwèi xiàyǔ suǒyǐ wǒ méi qù","인웨이 샤위 쒀이 워 메이 취","비가 와서 안 갔어요."],["因为太贵了，我没买。","yīnwèi tàiguì le wǒ méi mǎi","인웨이 타이꾸이 러 워 메이 마이","너무 비싸서 안 샀어요."],["我迟到了，因为堵车。","wǒ chídào le yīnwèi dǔchē","워 츠따오 러 인웨이 뚜처","차가 막혀서 늦었어요."],["我今天不能去，因为我要加班。","wǒ jīntiān bùnéng qù yīnwèi wǒyào jiābān","워   const mw=[...mem].filter(k=>k[0]==='w').length,ms=[...mem].filter(k=>k[0]==='s').length;
  $('stat').innerHTML=`외운 단어 <b>${mw}</b>/${tw} · 회화 <b>${ms}</b>/${ts}`}
const plain=t=>t.normalize('NFD').replace(/[\u0300-\u036f]/g,'').replace(/[\s']/g,'').toLowerCase();
const hit=(x,q)=>x.some(f=>String(f).toLowerCase().includes(q))||plain(x[1]).includes(plain(q));
function render(){
  if(mode==='quiz')return;
  const m=mode,q=$('q').value.trim().toLowerCase();
  $('pills').innerHTML=D[m].map((c,i)=>`<button data-c="${i}" aria-pressed="${!q&&i===cat[m]}">${esc(c[0])} <small>${c[2].length}</small></button>`).join('');
  items=[];
  if(q){D[m].forEach((c,ci)=>c[2].forEach((x,n)=>{if(items.length<300&&hit(x,q))items.push({m,c:ci,n,x})}))}
  else D[m][cat[m]][2].forEach((x,n)=>items.push({m,c:cat[m],n,x}));
  $('note').innerHTML=q?`검색 결과 ${items.length}개${items.length>=300?' (앞의 300개)':''}`:(D[m][cat[m]][1]||'카드를 누르면 한 번 읽어 줘요. 아래 ▶는 이 목록 전체를 순서대로 읽어 줘요.');
  const L=$('list');L.className='list'+(m==='s'?' s':'')+(set.blind?' blind':'');
  L.innerHTML=items.length?items.map((it,i)=>{const x=it.x,k=key(m,x),d=mem.has(k);
    return`<div class="card${d?' done':''}" data-i="${i}"><div class="t zh">${esc(x[0])}</div><div class="py">${esc(x[1])}</div><div class="hg">[${esc(x[2])}]</div><div class="ko">${esc(x[3])}</div><button class="ic sp" data-sp="${i}" aria-label="듣기">${SPK}</button><button class="ic mk" data-mk="${i}" aria-pressed="${d}" aria-label="외웠어요 표시">✓</button></div>`}).join(''):'<p class="empty">찾는 항목이 없어요. 다른 말로 검색해 보세요.</p>';
  stat();
}
// ---------- player ----------
let playing=false,queue=[],pos=0,run=0;
function buildQueue(){let q=items.map((_,i)=>i);if(set.skip)q=q.filter(i=>!mem.has(key(items[i].m,items[i].x)));
  if(set.shuf){for(let i=q.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[q[i],q[j]]=[q[j],q[i]]}}return q}
function mark(i){document.querySelectorAll('.card.now').forEach(e=>e.classList.remove('now'));
  const el=document.querySelector(`.card[data-i="${i}"]`);if(el){el.classList.add('now');el.scrollIntoView({block:'center',behavior:matchMedia('(prefers-reduced-motion: reduce)').matches?'auto':'smooth'})}
  const x=items[i]&&items[i].x;if(x){$('nowA').textContent=x[0];$('nowB').textContent=`${x[1]} · ${x[3]}`}
  $('prog').style.width=queue.length?((pos+1)/queue.length*100)+'%':'0'}
function setPlayIcon(){$('icPlay').hidden=playing;$('icPause').hidden=!playing;$('pPlay').setAttribute('aria-label',playing?'멈춤':'전체 듣기')}
async function loop(id){
  while(playing&&id===run&&pos<queue.length){
    const i=queue[pos],x=items[i].x;mark(i);
    for(let r=0;r<set.rep&&playing&&id===run;r++){await say(x[0],'zh-CN',set.rate);if(r<set.rep-1)await wait(set.gap*600)}
    if(!playing||id!==run)return;
    if(+set.ko){await wait(350);await say(x[3],'ko-KR',1);}
    if(!playing||id!==run)return;
    await wait(set.gap*1000);pos++;
  }
  if(id===run&&pos>=queue.length){playing=false;setPlayIcon();$('nowB').textContent='목록을 끝까지 들었어요. ▶를 누르면 처음부터 다시 들어요.'}
}
function play(from){stopSpeech();if(!items.length)return;queue=buildQueue();if(!queue.length){$('nowA').textContent='들을 항목이 없어요';$('nowB').textContent='‘외운 것 빼고 듣기’를 끄면 다시 들을 수 있어요.';return}
  pos=from!=null?Math.max(0,queue.indexOf(from)):0;if(pos<0)pos=0;playing=true;run++;setPlayIcon();loop(run)}
function pause(){playing=false;run++;stopSpeech();setPlayIcon()}
$('pPlay').onclick=()=>{if(playing)pause();else{if(queue.length&&pos<queue.length&&queue.every(i=>items[i]))resume();else play()}};
function resume(){playing=true;run++;setPlayIcon();loop(run)}
$('pNext').onclick=()=>{if(!queue.length){play();return}stopSpeech();pos=Math.min(pos+1,queue.length-1);if(playing){run++;loop(run)}else mark(queue[pos])};
$('pPrev').onclick=()=>{if(!queue.length){play();return}stopSpeech();pos=Math.max(pos-1,0);if(playing){run++;loop(run)}else mark(queue[pos])};
// ---------- events ----------
document.addEventListener('click',e=>{
  const c=e.target.closest('[data-c]');if(c){pause();queue=[];cat[mode]=+c.dataset.c;st('cat'+mode,cat[mode]);$('q').value='';render();scrollTo({top:0});return}
  const mk=e.target.closest('[data-mk]');if(mk){const it=items[+mk.dataset.mk],k=key(it.m,it.x);mem.has(k)?mem.delete(k):mem.add(k);st('mem',[...mem]);
    const on=mem.has(k);mk.setAttribute('aria-pressed',on);mk.closest('.card').classList.toggle('done',on);stat();return}
  const sp=e.target.closest('[data-sp]')||e.target.closest('.card');
  if(sp&&sp.closest('#list')){const i=+(sp.dataset.sp??sp.dataset.i),x=items[i].x;
    if(playing){queue=buildQueue();pos=Math.max(0,queue.indexOf(i));run++;stopSpeech();loop(run);return}
    const card=document.querySelector(`.card[data-i="${i}"]`);if(card)card.classList.add('show');
    stopSpeech();queue=buildQueue();pos=Math.max(0,queue.indexOf(i));mark(i);say(x[0],'zh-CN',set.rate);return}
  const g=e.target.closest('[data-go]');if(g){go(g.dataset.go);return}
  const qm=e.target.closest('[data-qm]');if(qm){qMode=qm.dataset.qm;document.querySelectorAll('[data-qm]').forEach(b=>b.setAttribute('aria-pressed',b===qm));qScore=[0,0];newQ();return}
});
let qt;$('q').addEventListener('input',()=>{clearTimeout(qt);qt=setTimeout(()=>{pause();queue=[];render()},200)});
const bindSel=(id,k)=>{const el=$(id);el.value=String(set[k]);el.onchange=()=>{set[k]=+el.value;st('set',set)}};
bindSel('sRate','rate');bindSel('sRep','rep');bindSel('sGap','gap');bindSel('sKo','ko');
const tog=(id,k,after)=>{const b=$(id);b.setAttribute('aria-pressed',set[k]);b.onclick=()=>{set[k]=!set[k];b.setAttribute('aria-pressed',set[k]);st('set',set);after&&after()}};
tog('bBlind','blind',()=>{$('list').classList.toggle('blind',set.blind);document.querySelectorAll('.card.show').forEach(e=>e.classList.remove('show'))});
tog('bSkip','skip',()=>{if(playing){const cur=queue[pos];queue=buildQueue();pos=Math.max(0,queue.indexOf(cur))}});
tog('bShuf','shuf',()=>{if(playing){play()}});
function go(m){pause();queue=[];mode=m;st('mode',m);
  document.querySelectorAll('[data-go]').forEach(b=>b.setAttribute('aria-current',b.dataset.go===m));
  $('vList').hidden=m==='quiz';$('vQuiz').hidden=m!=='quiz';$('player').hidden=m==='quiz';
  if(m==='quiz'){newQ()}else{lastList=m;render()}scrollTo({top:0})}
// ---------- quiz ----------
let qMode='w',qScore=[0,0],qCur=null,qWrong=[],qDone=false;
const pool=()=>{const a=[];D[qMode].forEach(c=>c[2].forEach(x=>a.push(x)));return a};
function newQ(){stopSpeech();const P=pool();qDone=false;
  qCur=(qWrong.length&&Math.random()<.35)?qWrong.shift():P[Math.floor(Math.random()*P.length)];
  const opts=[qCur[3]];while(opts.length<4){const o=P[Math.floor(Math.random()*P.length)][3];if(!opts.includes(o))opts.push(o)}
  opts.sort(()=>Math.random()-.5);
  $('qans').innerHTML='<div class="note">듣고 알맞은 뜻을 고르세요</div>';
  $('opts').innerHTML=opts.map(o=>`<button class="opt" data-o="${esc(o)}">${esc(o)}</button>`).join('');
  $('qnext').hidden=true;$('qscore').textContent=`${qScore[0]} / ${qScore[1]}`;
  say(qCur[0],'zh-CN',set.rate)}
$('opts').addEventListener('click',e=>{const b=e.target.closest('.opt');if(!b||qDone)return;qDone=true;qScore[1]++;
  const ok=b.dataset.o===qCur[3];if(ok)qScore[0]++;else qWrong.push(qCur);
  document.querySelectorAll('.opt').forEach(o=>{if(o.dataset.o===qCur[3])o.classList.add('right');else if(o===b)o.classList.add('wrong')});
  $('qans').innerHTML=`<div class="t zh">${esc(qCur[0])}</div><div class="py">${esc(qCur[1])}</div><div class="note">[${esc(qCur[2])}] · ${ok?'정답이에요!':'다음에 다시 나와요'}</div>`;
  $('qscore').textContent=`${qScore[0]} / ${qScore[1]}`;$('qnext').hidden=false;say(qCur[0],'zh-CN',set.rate)});
$('qnext').onclick=newQ;$('qPlay').onclick=()=>{stopSpeech();qCur&&say(qCur[0],'zh-CN',set.rate)};
$('qSlow').onclick=()=>{stopSpeech();qCur&&say(qCur[0],'zh-CN',0.6)};
if(!('speechSynthesis' in window)){$('nowA').textContent='이 브라우저는 음성 읽기를 지원하지 않아요';$('nowB').textContent='Chrome이나 Safari 최신 버전에서 열어 주세요.'}
go(mode);
}
</script>
<script>if('serviceWorker' in navigator)addEventListener('load',()=>navigator.serviceWorker.register('sw.js').catch(()=>{}));</script>
